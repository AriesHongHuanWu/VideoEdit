name: Provide temporary VideoEdit transfer access
on:
  push:
    branches:
      - codex/import-italy-rome-20261126
    paths:
      - .github/workflows/videoedit-transfer-access.yml
permissions:
  contents: write
jobs:
  temporary-access:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      COLAB_PUBLIC_KEY: 
    steps:
      - name: Encrypt the repository-scoped credential
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -m venv "$RUNNER_TEMP/videoedit-relay"
          "$RUNNER_TEMP/videoedit-relay/bin/python" -m pip -q install --disable-pip-version-check cryptography==46.0.3
          payload="$("$RUNNER_TEMP/videoedit-relay/bin/python" - <<'PY'
          import base64, json, os
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          encode = lambda b: base64.b64encode(b).decode()
          pub = serialization.load_der_public_key(base64.b64decode(os.environ["COLAB_PUBLIC_KEY"]))
          key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)
          wrapped = pub.encrypt(key, padding.OAEP(mgf=padding.MGF1(hashes.SHA256()), algorithm=hashes.SHA256(), label=None))
          data = AESGCM(key).encrypt(nonce, os.environ["GH_TOKEN"].encode(), b"VideoEdit Colab transfer")
          print(encode(json.dumps({"key": encode(wrapped), "nonce": encode(nonce), "data": encode(data)}).encode()))
          PY
          )"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.github/drive-video-import/relay-$GITHUB_RUN_ID.b64" \
            -f branch="$GITHUB_REF_NAME" -f 'message=Deliver encrypted one-time Colab credential' \
            -f content="$payload" --silent
      - name: Keep the scoped session active until the import is published
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 138); do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/videoedit-italy-rome" --jq '.draft' 2>/dev/null | grep -qx false; then
              echo "VideoEdit archive published."
              exit 0
            fi
            sleep 45
          done
          echo "Temporary session expired before publication."
          exit 1